[project]
name = "hofsuche"
version = "0.1.0"
description = "Häuser und Höfe in Brandenburg und Sachsen finden und nach eigenen Kriterien ranken."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hofsuche = "hofsuche.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hofsuche*"]
